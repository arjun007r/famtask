name = "famtask"
main = "src/worker.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "famtask"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Digest sweep. Runs hourly; the engine only sends to members whose
# local digest hour matches, so per-person send times work on one trigger.
[triggers]
crons = ["0 * * * *"]

[vars]
CLAUDE_MODEL = "claude-opus-5"
