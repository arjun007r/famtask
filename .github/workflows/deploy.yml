# Push to main and the Worker updates itself.
#
# The point is not convenience: it is that the two steps that matter are easy
# to forget by hand and impossible to forget here -- the tests run before
# anything ships, and the migrations run before the code that needs them. A
# deploy ahead of its schema takes the bot down until someone notices.
name: Deploy

on:
  push:
    branches: [main]
  # Deploy the current main on demand, from the Actions tab -- which works
  # from a phone, unlike a terminal.
  workflow_dispatch:

# A second push mid-deploy should queue, never race the first.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Point wrangler.toml at the real D1 database
        # The id is not in the repo, so it is read from the account here.
        # Nothing to forget, and nothing for a pull to revert.
        run: npm run config:d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Explain a Cloudflare refusal
        # Only when something above failed. Error 10000 covers four different
        # problems and guessing between them costs a round trip each.
        if: failure()
        run: npm run check:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply migrations
        # Before the deploy, always. The reverse order is an outage.
        run: npx wrangler d1 migrations apply famtask --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check it answers
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://famtask.famtask.workers.dev/health; then
              echo "  ...healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Worker did not answer /health after deploying" >&2
          exit 1
